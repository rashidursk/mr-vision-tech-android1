name: mr_vision_tech
description: Offline business ERP
publish_to: none
version: 3.6.3+22
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^7.0.0
  file_picker: ^10.3.3
  sqflite: ^2.4.2
  path: ^1.9.0
  intl: ^0.20.2
  pdf: ^3.11.3
  printing: ^5.14.2
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/developer.jpg

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo.png
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/branding_safe.png
flutter_native_splash:
  color: '#FFFFFF'
  image: assets/logo.png
  android_12:
    color: '#FFFFFF'
    image: assets/branding_safe.png
  ios: false
