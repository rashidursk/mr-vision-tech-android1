name: Build MR Vision Tech APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name mr_vision_tech .
          fi
      - name: Set Android App Name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="MR VisionTech"/' android/app/src/main/AndroidManifest.xml
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Launcher Icon
        run: dart run flutter_launcher_icons
      - name: Generate Splash Screen
        run: dart run flutter_native_splash:create
      - name: Build Android APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MR-Vision-Tech-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
